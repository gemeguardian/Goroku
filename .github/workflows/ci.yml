name: Go CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# M9.1: checkout before setup-go, pin Go patch, pin actions by SHA,
# pin golangci-lint, go mod tidy diff, clean binary build, package parity.
# M9.2: pinned govulncheck (advisory).
# M9.3: soft coverage floor 20% on critical packages.
# M9.4: critical suites via scripts/test-critical.sh (also covered by go test -race ./...).

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: go.mod
        cache: true

    - name: Check Formatting (gofmt)
      run: |
        # Only files in main-module packages (gofmt -l on repo root walks runtime trees).
        files=$(go list -f '{{range .GoFiles}}{{$.Dir}}/{{.}}{{"\n"}}{{end}}{{range .TestGoFiles}}{{$.Dir}}/{{.}}{{"\n"}}{{end}}{{range .XTestGoFiles}}{{$.Dir}}/{{.}}{{"\n"}}{{end}}' ./...)
        unformatted=$(printf '%s\n' "$files" | sed '/^$/d' | tr '\n' '\0' | xargs -0 gofmt -l || true)
        if [ -n "$unformatted" ]; then
          echo "The following files are not formatted. Run 'go fmt ./...':"
          echo "$unformatted"
          exit 1
        fi

    - name: Verify dependencies
      run: go mod verify

    - name: Check go mod tidy
      run: |
        go mod tidy
        git diff --exit-code go.mod go.sum

    - name: Package parity (ignored sources must not alter build)
      run: bash scripts/check-package-parity.sh

    - name: Run go vet
      run: go vet ./...

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84 # v6
      with:
        version: v1.64.8

    - name: Build main binary
      run: go build -o "${TMPDIR:-/tmp}/goroku_bin" .

    # M9.2: pin govulncheck; advisory while residual stdlib/transitive findings
    # need deliberate Go/x/* bumps (gotd/td mass upgrade is out of scope).
    # Secret scanning / SBOM / dependency-review: residual — see docs/CI.md.
    - name: govulncheck (advisory)
      continue-on-error: true
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
        "$(go env GOPATH)/bin/govulncheck" -show version ./...
        "$(go env GOPATH)/bin/govulncheck" ./...

    # M9.3: soft floor 20% on critical packages — avoid flaky high gates.
    # Targets for critical flows are documented in docs/CI.md (not hard CI gates).
    - name: Coverage soft floor (20% critical packages)
      run: |
        profile="${TMPDIR:-/tmp}/coverage-critical.out"
        go test -count=1 -covermode=atomic -coverprofile="$profile" \
          ./goroku/ ./goroku/web/ ./goroku/inline/ ./goroku/utils/ ./goroku/cache/
        go tool cover -func="$profile" | tail -5
        total=$(go tool cover -func="$profile" | awk '/^total:/ {gsub(/%/,"",$3); print $3}')
        echo "Critical-package statement coverage: ${total}%"
        awk -v t="$total" 'BEGIN { if (t+0 < 20) { print "coverage below soft floor 20%"; exit 1 } }'

    # Full race suite (includes M9.4 critical packages). Local equivalent of
    # the required subset: bash scripts/test-critical.sh
    - name: Run tests
      run: go test -race ./...
