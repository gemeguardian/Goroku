name: Go CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
  # Optional weekly strict vuln scan (does not block PR merge).
  schedule:
    - cron: "17 4 * * 1"

# M9.1: checkout before setup-go, pin Go patch, pin actions by SHA,
# pin golangci-lint, go mod tidy diff, clean binary build, package parity.
# M9.2: pinned govulncheck (advisory in main job; optional strict job).
# M9.3: soft coverage floor 20% on critical packages.
# M9.4: critical suites via scripts/test-critical.sh (also covered by go test -race ./...).

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
    # Incremental lint compares against HEAD~1, so the parent commit must be
    # present; checkout's default shallow clone has only HEAD.
    - name: Check out code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        fetch-depth: 2

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: go.mod
        cache: true

    - name: Check Formatting (gofmt)
      run: |
        # Only files in main-module packages (gofmt -l on repo root walks runtime trees).
        files=$(go list -f '{{range .GoFiles}}{{$.Dir}}/{{.}}{{"\n"}}{{end}}{{range .TestGoFiles}}{{$.Dir}}/{{.}}{{"\n"}}{{end}}{{range .XTestGoFiles}}{{$.Dir}}/{{.}}{{"\n"}}{{end}}' ./...)
        unformatted=$(printf '%s\n' "$files" | sed '/^$/d' | tr '\n' '\0' | xargs -0 gofmt -l || true)
        if [ -n "$unformatted" ]; then
          echo "The following files are not formatted. Run 'go fmt ./...':"
          echo "$unformatted"
          exit 1
        fi

    - name: Verify dependencies
      run: go mod verify

    - name: Check go mod tidy
      run: |
        go mod tidy
        git diff --exit-code go.mod go.sum

    - name: Package parity (ignored sources must not alter build)
      run: bash scripts/check-package-parity.sh

    - name: Run go vet
      run: go vet ./...

    # Build the pinned linter with the same Go toolchain as this module. The
    # upstream v1.64.8 binary was built with Go 1.24 and cannot lint go 1.25.
    # Existing lint debt predates this gate, so block regressions introduced by
    # each push while it is paid down instead of turning the first compatible
    # linter run into an all-or-nothing migration.
    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84 # v6
      with:
        version: v1.64.8
        install-mode: goinstall
        args: --new-from-rev=HEAD~1

    - name: Build main binary
      run: go build -o "${TMPDIR:-/tmp}/goroku_bin" .

    # M9.2: pin govulncheck via scripts/govulncheck.sh (advisory by default).
    # Full scan stays non-blocking (stdlib / transitive noise). Hard gate on
    # direct go.mod deps only is the separate job govulncheck-direct.
    # Secret scanning: scripts/scan-secrets.sh (tracked tree only).
    # Syft full SBOM / PR dependency-review: residual — see docs/CI.md.
    - name: Secret scan (tracked tree)
      run: bash scripts/scan-secrets.sh

    - name: govulncheck (advisory)
      run: bash scripts/govulncheck.sh

    # M9.3: soft floor 20% on critical packages — avoid flaky high gates.
    # Targets for critical flows are documented in docs/CI.md (not hard CI gates).
    - name: Coverage soft floor (20% critical packages)
      run: |
        profile="${TMPDIR:-/tmp}/coverage-critical.out"
        go test -count=1 -covermode=atomic -coverprofile="$profile" \
          ./goroku/ ./goroku/web/ ./goroku/inline/ ./goroku/utils/ ./goroku/cache/
        go tool cover -func="$profile" | tail -5
        total=$(go tool cover -func="$profile" | awk '/^total:/ {gsub(/%/,"",$3); print $3}')
        echo "Critical-package statement coverage: ${total}%"
        awk -v t="$total" 'BEGIN { if (t+0 < 20) { print "coverage below soft floor 20%"; exit 1 } }'

    # Full race suite (includes M9.4 critical packages). Local equivalent of
    # the required subset: bash scripts/test-critical.sh
    - name: Run tests
      run: go test -race ./...

    # M10: required lightweight SBOM (no Syft). Upload as release-style artifact.
    - name: Generate SBOM (generate-sbom.sh)
      run: |
        GOROKU_BIN="${TMPDIR:-/tmp}/goroku_bin" bash scripts/generate-sbom.sh dist/sbom
        test -f dist/sbom/sbom.cdx.json
        test -f dist/sbom/SBOM_ARTIFACTS.txt

    - name: Upload SBOM artifacts
      uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
      with:
        name: sbom
        path: |
          dist/sbom/
          dist/SBOM_LATEST_PATH.txt
        if-no-files-found: error

    # Optional richer Syft SBOM: install pinned binary; never hard-fail main job.
    - name: Optional Syft SBOM (continue-on-error)
      continue-on-error: true
      env:
        SYFT_VERSION: v1.18.1
      run: |
        set -euo pipefail
        install_dir="${RUNNER_TEMP:-/tmp}/syft-${SYFT_VERSION}"
        mkdir -p "$install_dir"
        # install.sh from the pinned tag; version arg selects the Syft release.
        curl -sSfL "https://raw.githubusercontent.com/anchore/syft/${SYFT_VERSION}/install.sh" \
          | sh -s -- -b "$install_dir" "${SYFT_VERSION}"
        export PATH="${install_dir}:${PATH}"
        syft version
        mkdir -p dist/syft
        syft dir:. \
          -o "cyclonedx-json=dist/syft/syft.cdx.json" \
          -o "spdx-json=dist/syft/syft.spdx.json"
        ls -la dist/syft

    - name: Upload optional Syft SBOM
      if: success() || failure()
      continue-on-error: true
      uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
      with:
        name: sbom-syft
        path: dist/syft/
        if-no-files-found: ignore

  # Hard gate: fails only when the vulnerable module is a direct go.mod require.
  # Stdlib and transitive findings are ignored (filtered from govulncheck -json).
  # Does not block on residual stdlib noise; main job stays advisory for full scan.
  govulncheck-direct:
    name: govulncheck (direct deps)
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: go.mod
        cache: true
    - name: govulncheck direct-module-deps only
      env:
        GOVULNCHECK_DIRECT_ONLY: "1"
      run: bash scripts/govulncheck.sh

  # Optional full hard gate: does not block PRs (dispatch / weekly only).
  # Use after deliberate Go/x/* bumps; not a gotd mass-upgrade path.
  govulncheck-strict:
    name: govulncheck (strict full, optional)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
    - name: Check out code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: go.mod
        cache: true
    - name: govulncheck strict
      env:
        GOVULNCHECK_STRICT: "1"
      run: bash scripts/govulncheck.sh
